  .card { position: relative; display: block; width: 100%; height: 100%; padding: 0; border: 0; background: none; cursor: pointer; perspective: 900px; }

  h1, h2 { font-family: var(--font-title); font-weight: 600; color: var(--primary-dark); line-height: 1; }

  }
</style>

  }

// Склонение: plural(2, 'пара', 'пары', 'пар') → 'пары'

function layout() {
  const cols = BRAND.grid.cols, rows = Math.ceil(PAIRS * 2 / cols);
  const W = window.innerWidth, H = window.innerHeight;
  const hudH = $('hud').offsetHeight;
  const gap = Math.round(Math.max(8, Math.min(14, W / 45)));
  const availW = Math.min(W - 32, 640);
  const availH = H - hudH - 60;
  const byW = (availW - gap * (cols - 1)) / cols;
  const byH = (availH - gap * (rows - 1)) / rows * 0.8;
  const cw = Math.floor(Math.max(48, Math.min(byW, byH, 150)));
  rootStyle.setProperty('--cw', cw + 'px');
  rootStyle.setProperty('--ch', Math.round(cw / 0.8) + 'px');
  rootStyle.setProperty('--gap', gap + 'px');

  if (!audio || muted || audio.state !== 'running') return;

    const o = audio.createOscillator(), g = audio.createGain();

    g.gain.exponentialRampToValueAtTime(0.0001, t + dur / mul);

  });
}

  tick() { bell(1760, 0.05, 0.025, 0, 'square'); },
  win() { [523.3, 659.3, 784, 1046.5, 1318.5].forEach((f, i) => bell(f, 1.1, 0.07, i * 0.11)); },

const state = { mode: 'menu', deck: [], open: [], found: 0, moves: 0, timeLeft: BRAND.roundSeconds, started: false, pending: null };

function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

function deal() {
  const chosen = shuffle(ITEMS.slice()).slice(0, PAIRS);
  state.deck = shuffle(chosen.concat(chosen).map(it => ({ it, open: false, matched: false })));
  $('board').innerHTML = state.deck.map((c, i) => `<div class="slot" style="--d:${(i * 0.035).toFixed(3)}s">

      <div class="face front"><div class="glow"></div>${c.it.html}</div></div></button></div>`).join('');
  cardEls = [...$('board').querySelectorAll('.card')];
}

function startGame() {
  ensureAudio(); if (audio) audio.resume();

  deal();

}

function setOpen(i, open) {
  state.deck[i].open = open;
  cardEls[i].classList.toggle('open', open);
  cardEls[i].setAttribute('aria-label', open || state.deck[i].matched ? state.deck[i].it.label : `Карточка ${i + 1}`);
}

function clearPending() {
  if (!state.pending) return;
  state.pending.timers.forEach(clearTimeout);
  state.pending.cards.forEach(i => { setOpen(i, false); cardEls[i].classList.remove('wrong'); });
  state.pending = null;
}

function onCard(i) {
  if (state.mode !== 'play') return;
  const c = state.deck[i];
  if (c.matched || c.open) return;
  clearPending();
  if (!state.started) { state.started = true; lastTs = performance.now(); $('hint').classList.add('hide'); }
  ensureAudio(); if (audio && audio.state !== 'running' && !muted) audio.resume();
  setOpen(i, true);
  sfx.flip();
  state.open.push(i);
  if (state.open.length < 2) return;
  const [a, b] = state.open;
  state.open = [];
  state.moves++;
  if (state.deck[a].it.key === state.deck[b].it.key) {
    state.found++;
    [a, b].forEach(k => { state.deck[k].matched = true; cardEls[k].classList.add('matched'); sparkle(cardEls[k]); });
    setTimeout(sfx.match, 280);
    if (state.found === PAIRS) { state.mode = 'won'; setTimeout(win, 900); }
  } else {
    state.pending = { cards: [a, b], timers: [
      setTimeout(() => { cardEls[a].classList.add('wrong'); cardEls[b].classList.add('wrong'); sfx.miss(); }, 480),
      setTimeout(() => { const p = state.pending; state.pending = null; if (p) p.cards.forEach(k => { setOpen(k, false); cardEls[k].classList.remove('wrong'); }); }, 1000),
    ] };
  }
  updateHud();
}

function sparkle(el) {

    s.innerHTML = `<svg viewBox="0 0 24 24"><path d="M12 0l2.6 9.4L24 12l-9.4 2.6L12 24l-2.6-9.4L0 12l9.4-2.6z" fill="${C.gold}"/></svg>`;

      <div class="gift" style="margin:0 0 4px">${ICON_GIFT}<span>${BRAND.prize.text}</span></div>
      <p class="muted">Ждёт вас, когда соберёте все пары за ${BRAND.roundSeconds} ${plural(BRAND.roundSeconds, 'секунду', 'секунды', 'секунд')}</p>
    </div>
    <button class="btn" id="btnAgain">Попробовать ещё раз</button>
    <button class="btn outline" id="btnShare">Позвать друга</button>`;
  bindEndButtons();
  setTimeout(showEnd, 1400);
}

function showEnd() { $('endScreen').classList.remove('hidden'); $('endScreen').scrollTop = 0; }

function bindEndButtons() {
  const copyBtn = $('btnCopy');
  if (copyBtn) copyBtn.addEventListener('click', () => copyText(BRAND.prize.code, copyBtn, 'Код скопирован'));
  $('btnAgain').addEventListener('click', startGame);
  $('btnShare').addEventListener('click', share);
}

function copyText(text, btn, doneLabel) {
  const done = ok => { btn.textContent = ok ? doneLabel : 'Не удалось скопировать'; };
  const fallback = () => {
    try {
      const ta = document.createElement('textarea');
      ta.value = text; ta.setAttribute('readonly', ''); ta.style.cssText = 'position:fixed;opacity:0';
      document.body.appendChild(ta); ta.select();
      const ok = document.execCommand('copy'); ta.remove(); done(ok);
    } catch (e) { done(false); }
  };
  if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(text).then(() => done(true), fallback);
  else fallback();
}

function share() {
  const url = location.protocol.startsWith('http') ? location.href.split('#')[0] : '';
  const text = BRAND.shareText;
  if (navigator.share) { navigator.share({ title: BRAND.title, text, url: url || undefined }).catch(() => {}); return; }
  copyText(url ? `${text} ${url}` : text, $('btnShare'), url ? 'Ссылка скопирована' : 'Текст скопирован');
}

// ---------- Салют из лепестков ----------
const fx = $('fx'), fctx = fx.getContext('2d');
let petals = [], fxRunning = false;
function confetti() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2), W = window.innerWidth, H = window.innerHeight;
  fx.width = W * dpr; fx.height = H * dpr; fctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const colors = [C.primary, '#B7A0DC', C.rose, '#EFD3D3', C.gold, '#F3DFA8', '#FFFFFF'];
  const reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  const n = reduce ? 30 : 150;
  for (let i = 0; i < n; i++) {
    const fromSide = i % 2 ? 1 : -1, burst = i < n * 0.5;
    petals.push(burst ? {
      x: W / 2 + fromSide * W * 0.35, y: H * 0.75, vx: -fromSide * (120 + Math.random() * 260), vy: -(380 + Math.random() * 420),
      r: 4 + Math.random() * 5, rot: Math.random() * 6, vr: (Math.random() - .5) * 8, color: colors[i % colors.length], sway: Math.random() * 6, t: 0,
    } : {
      x: Math.random() * W, y: -20 - Math.random() * H * 0.6, vx: 0, vy: 60 + Math.random() * 90,
      r: 4 + Math.random() * 5, rot: Math.random() * 6, vr: (Math.random() - .5) * 5, color: colors[i % colors.length], sway: Math.random() * 6, t: 0,
    });
  }
  if (!fxRunning) { fxRunning = true; let prev = performance.now(); requestAnimationFrame(function step(now) {
    const dt = Math.min(0.05, (now - prev) / 1000); prev = now;
    fctx.clearRect(0, 0, W, H);
    petals = petals.filter(p => p.y < H + 30 && p.t < 6);
    for (const p of petals) {
      p.t += dt; p.vy += 420 * dt; p.vy = Math.min(p.vy, 150); p.vx *= 0.985;
      p.x += (p.vx + Math.sin(p.t * 3 + p.sway) * 30) * dt; p.y += p.vy * dt; p.rot += p.vr * dt;
      fctx.save(); fctx.translate(p.x, p.y); fctx.rotate(p.rot);
      fctx.globalAlpha = Math.min(1, (6 - p.t) / 1.2);
      fctx.fillStyle = p.color;
      fctx.beginPath(); fctx.ellipse(0, 0, p.r * 0.55, p.r, 0, 0, Math.PI * 2); fctx.fill();
      fctx.restore();
    }
    if (petals.length) requestAnimationFrame(step); else { fxRunning = false; fctx.clearRect(0, 0, W, H); }
  }); }
}

// ---------- Таймер ----------
let lastTs = performance.now();
function loop(now) {
  const dt = Math.min(0.1, (now - lastTs) / 1000);
  lastTs = now;
  if (state.mode === 'play' && state.started && !document.hidden) {
    state.timeLeft -= dt;
    if (state.timeLeft <= 0) { state.timeLeft = 0; updateHud(); lose(); }
    else updateHud();
  }
  requestAnimationFrame(loop);
}

// ---------- Управление ----------
$('board').addEventListener('click', e => {
  const card = e.target.closest('.card');
  if (card) onCard(+card.dataset.i);
});
$('btnPlay').addEventListener('click', startGame);
window.addEventListener('keydown', e => {
  if (e.key === 'Enter' && state.mode === 'menu') { e.preventDefault(); startGame(); }
});
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { if (audio) audio.suspend(); }
  else { lastTs = performance.now(); if (audio && !muted) audio.resume(); }
});
window.addEventListener('resize', layout);

setupStatic();
updateSoundBtn();
deal();
layout();
updateHud(true);
requestAnimationFrame(loop);
</script>
</body>
